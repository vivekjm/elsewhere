name: Apply verified Elsewhere source
on:
  push:
    branches: ['fix/calendar-wardrobe-ui-completion']
    paths: ['.github/workflows/apply-ui.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calendar-wardrobe-ui-completion
      - name: Verify and apply reviewed source files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          shas = [
            '5fd0d10b3440ac8493b237b0ac998c0595362679',
            '87c131f695a10cc686dc1a16f7a79ec760d22275',
            '21a187c0cc31114f76a543063eb16706550cea00',
            '9ef4d446488666a871bae8b494c953cc3a3dae74',
            '479733134e355877f7e4d2c2ef5254926cdc8d12',
            '1a7ff33dfd174627972a4c0d1f75369155d2284e',
            'ad8ecc126ffaa1ec77efd3349edf7bd7decacc9c',
            '0679eb7acf43bff24fe204e8f345a257762b3e82',
            '5c29f9afb579574d5ae965b40f2614fbdfad43ca',
            '0884b3a6198903763efb0334987dd8e1d90cc643',
          ]
          chunks = []
          for sha in shas:
            request = urllib.request.Request(
              'https://api.github.com/repos/vivekjm/elsewhere/git/blobs/' + sha,
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'User-Agent': 'elsewhere-source-verification'},
            )
            with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
            assert blob['encoding'] == 'base64'
            chunk = base64.b64decode(blob['content'])
            assert hashlib.sha1(('blob ' + str(len(chunk)) + '\0').encode() + chunk).hexdigest() == sha
            chunks.append(chunk)
          bundle = b''.join(chunks)
          assert hashlib.sha256(bundle).hexdigest() == 'a24d465399c80b1528bee75360afc3499004ad9270b13f5f973d6f1cb4511ab0'
          payload = json.loads(lzma.decompress(bundle, memlimit=256*1024*1024))
          paths = [
            '.github/workflows/quality.yml', 'README.md', 'app/elsewhere.css', 'app/globals.css', 'app/page.tsx',
            'components/travel/editor.tsx', 'components/travel/garment.tsx', 'components/travel/icons.tsx',
            'components/travel/landscape.tsx', 'components/travel/primitives.tsx', 'components/travel/views.tsx',
            'components/travel/workspace.tsx', 'docs/VERIFICATION.md', 'e2e/browser.py', 'hooks/use-workspace.ts',
            'lib/backup.ts', 'lib/exports.ts', 'lib/model.ts', 'lib/planning.ts', 'tests/planning.test.ts',
          ]
          assert set(payload['files']) == set(paths) == set(payload['hashes'])
          root = pathlib.Path.cwd().resolve()
          for name in paths:
            data = payload['files'][name].encode('utf-8')
            assert hashlib.sha256(data).hexdigest() == payload['hashes'][name]
            path = root / name
            assert root in path.resolve().parents and not path.is_symlink()
            # Workflow changes are applied separately through the authorized connector.
            if name.startswith('.github/'):
              continue
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_bytes(data)
          files = [name for name in paths if not name.startswith('.github/')]
          subprocess.run(['git', 'add', '--', *files], check=True)
          print('Verified and applied', len(files), 'source, test and documentation files.')
          PY
      - name: Commit without rewriting branch history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m 'feat: restore Elsewhere design and complete connected trip planning'
          git push origin HEAD:fix/calendar-wardrobe-ui-completion
