name: Finalize reviewed UI source
on:
  push:
    branches: ['fix/calendar-wardrobe-ui-completion']
    paths: ['.github/workflows/finalize-ui.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/calendar-wardrobe-ui-completion
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrowly checked lifecycle and lint fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          expected = {
            'hooks/use-workspace.ts': '91719ccae935f2c7689f23801662c100a813e6c7',
            'components/travel/views.tsx': '81321f760f2de96cea6cce9846e6a30aac0e862a',
            'components/travel/garment.tsx': '14219689a64cc3d69e585c97fa811918538bf565',
          }
          for name, sha in expected.items():
            assert subprocess.check_output(['git', 'hash-object', name], text=True).strip() == sha
          p = Path('hooks/use-workspace.ts')
          s = p.read_text().replace('alive.current = true; void load();', 'alive.current = true;\n    // A cancellable startup task avoids duplicate guest initialization in Strict Mode.\n    const initialLoad = setTimeout(() => { void load(); }, 0);')
          s = s.replace('      dispose();', '      clearTimeout(initialLoad);\n      dispose();')
          p.write_text(s)
          p = Path('components/travel/views.tsx')
          s = p.read_text().replace('tripDates, dayOutfits, type Workspace, type Trip, type Activity, type Item, type Outfit', 'tripDates, type Workspace, type Trip, type Activity')
          p.write_text(s)
          p = Path('components/travel/garment.tsx')
          s = p.read_text().replace('  if (item.image && item.image !== failedImage) return <img', '  // These private image URLs require the visitor cookie; an optimization proxy cannot read them.\n  // eslint-disable-next-line @next/next/no-img-element\n  if (item.image && item.image !== failedImage) return <img')
          p.write_text(s)
          PY
      - name: Format the restored application source
        run: |
          npm exec --yes --package=prettier@3.6.2 -- prettier --write app/page.tsx app/globals.css app/elsewhere.css components/travel/editor.tsx components/travel/garment.tsx components/travel/icons.tsx components/travel/landscape.tsx components/travel/primitives.tsx components/travel/views.tsx components/travel/workspace.tsx hooks/use-workspace.ts lib/backup.ts lib/exports.ts lib/model.ts lib/planning.ts tests/planning.test.ts
      - name: Verify the cleaned source before committing
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
      - name: Commit without rewriting history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- app/page.tsx app/globals.css app/elsewhere.css components/travel/editor.tsx components/travel/garment.tsx components/travel/icons.tsx components/travel/landscape.tsx components/travel/primitives.tsx components/travel/views.tsx components/travel/workspace.tsx hooks/use-workspace.ts lib/backup.ts lib/exports.ts lib/model.ts lib/planning.ts tests/planning.test.ts
          git commit -m 'fix: make workspace hydration cancellable and polish restored source'
          git push origin HEAD:fix/calendar-wardrobe-ui-completion
