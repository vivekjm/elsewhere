name: Visual development snapshot
on:
  push:
    branches: ['feat/visual-calendar-moods']
    paths: ['.github/workflows/visual-dev-snapshot.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Package tracked source and development runtime only
        run: |
          mkdir -p snapshot
          git archive --format=tar HEAD | gzip > snapshot/source.tgz
          tar -czf snapshot/runtime.tgz node_modules/react node_modules/react-dom node_modules/scheduler node_modules/@types/react node_modules/@types/react-dom node_modules/@types/node node_modules/csstype node_modules/zod node_modules/typescript node_modules/esbuild node_modules/@esbuild node_modules/undici-types
      - uses: actions/upload-artifact@v4
        with:
          name: visual-dev-snapshot
          path: snapshot/
          retention-days: 1
